spring:
  application:
    name: eol-poc-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oss-eol}
    username: ${DB_USERNAME:oss-eol}
    password: ${DB_PASSWORD:oss-eol}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

eol:
  zone: Asia/Seoul
  soon-threshold-days: 90
  collection:
    cron: "0 0 3 * * *"
  ai:
    model: claude-sonnet-5-5
    effort: medium
    max-tokens: 32000
    prompt-version: extract-v1
  cors:
    allowed-origins: http://localhost:5173
